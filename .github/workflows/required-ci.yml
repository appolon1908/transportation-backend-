name: Required CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPOSITORY_CLASS: backend
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  validate:
    name: required-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgis/postgis:17-3.5@sha256:5c88b8231230b803d74220c62b56a577085466fc5880be98a1ab8195249a7ebb
        env:
          POSTGRES_DB: freight
          POSTGRES_USER: freight
          POSTGRES_PASSWORD: freight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freight -d freight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://freight:freight@localhost:5432/freight
      INGRESS_DATABASE_URL: postgresql+asyncpg://freight:freight@localhost:5432/freight
      WORKER_DATABASE_URL: postgresql+asyncpg://freight:freight@localhost:5432/freight
      ALLOW_DEVELOPMENT_IDENTITY_HEADERS: "true"
      COMPLIANCE_IDENTIFIER_PEPPER: ci-only-pepper
      OIDC_ISSUER: https://auth.example.test/realms/freight
      OIDC_AUDIENCE: freight-api
      INTEGRATION_ALLOWED_HOSTS: localhost,127.0.0.1,odoo.internal.example,n8n.internal.example
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact clean checkout
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.14.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" --output "$archive"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          install -m 0755 "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/gitleaks-bin"
      - name: Reject committed secrets
        run: |
          "$RUNNER_TEMP/gitleaks-bin" dir --no-banner --redact --exit-code 1 .
      - name: Validate canonical repository identity contracts
        run: python scripts/ci/validate_repository_identity.py --evidence evidence/repository-identity.json
      - name: Prepare isolated contract database
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --no-input -e ".[dev]"
          python scripts/ci/prepare_contract_database.py
      - name: Run repository-aware CI
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          python scripts/ci/validate_repository.py --root . --mode ci --branch "$SOURCE_BRANCH" --repository-class "$REPOSITORY_CLASS" --evidence evidence/required-ci.json
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: required-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
