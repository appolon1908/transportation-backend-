name: integrations-ci

on:
  pull_request:
    paths:
      - "app/config.py"
      - "app/db.py"
      - "app/integrations/**"
      - "app/integrations_main.py"
      - "workers/integration_worker.py"
      - "migrations/versions/0003_integrations_durability.py"
      - "migrations/versions/0004_integration_rls_roles.py"
      - "migrations/versions/0005_portal_workflows.py"
      - "tests/test_integrations_contract.py"
      - "tests/test_release_readiness_contract.py"
      - "deploy/**"
      - "scripts/deployment/**"
      - ".github/workflows/integrations-ci.yml"
  push:
    branches:
      - "be/integrations-webhooks-provenance-v3"
      - "be/release-readiness-v6"
      - "be/api-contract-readiness-v1"

permissions:
  contents: read

concurrency:
  group: integrations-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:17-3.5@sha256:5c88b8231230b803d74220c62b56a577085466fc5880be98a1ab8195249a7ebb
        env:
          POSTGRES_USER: freight
          POSTGRES_PASSWORD: freight
          POSTGRES_DB: freight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freight -d freight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://freight:freight@127.0.0.1:5432/freight_test
      INGRESS_DATABASE_URL: postgresql+asyncpg://freight:freight@127.0.0.1:5432/freight_test
      WORKER_DATABASE_URL: postgresql+asyncpg://freight:freight@127.0.0.1:5432/freight_test
      ALLOW_DEVELOPMENT_IDENTITY_HEADERS: "true"
      OIDC_ISSUER: https://auth.example.test/realms/freight
      OIDC_AUDIENCE: freight-api
      OIDC_JWKS_URL: https://auth.example.test/realms/freight/protocol/openid-connect/certs
      INTEGRATION_ALLOWED_HOSTS: localhost,127.0.0.1,odoo.internal.example,n8n.internal.example

    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install reviewed Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit

      - name: Compile integration runtime
        run: >-
          python -m compileall -q
          app/config.py app/db.py app/integrations app/integrations_main.py
          workers/integration_worker.py migrations
          tests/test_integrations_contract.py tests/test_release_readiness_contract.py
          scripts/deployment

      - name: Lint integration runtime
        run: >-
          ruff check
          app/config.py app/db.py app/integrations app/integrations_main.py
          workers/integration_worker.py migrations/versions/0003_integrations_durability.py
          migrations/versions/0004_integration_rls_roles.py
          migrations/versions/0005_portal_workflows.py
          tests/test_integrations_contract.py tests/test_release_readiness_contract.py
          scripts/deployment

      - name: Build auditable runtime dependency input
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          dependencies = metadata.get("project", {}).get("dependencies", [])
          if not dependencies:
              raise SystemExit("project.dependencies is empty")
          output = Path("/tmp/runtime-requirements.txt")
          output.write_text("\n".join(dependencies) + "\n", encoding="utf-8")
          print(output.read_text(encoding="utf-8"))
          PY

      - name: Dependency vulnerability audit
        run: pip-audit --strict --desc -r /tmp/runtime-requirements.txt

      - name: Apply canonical migration chain
        run: |
          alembic upgrade head
          alembic current | tee /tmp/alembic-current.txt
          grep -q "0005_portal_workflows" /tmp/alembic-current.txt

      - name: Verify integration security migrations are reversible
        run: |
          alembic downgrade 0003_integrations_durability
          alembic upgrade head
          alembic current | grep -q "0005_portal_workflows"

      - name: Verify RLS roles and opaque webhook resolver
        env:
          PGPASSWORD: freight
        run: |
          psql -h 127.0.0.1 -U freight -d freight_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $block$
          DECLARE
              role_count integer;
              function_exists boolean;
          BEGIN
              SELECT count(*) INTO role_count
              FROM pg_roles
              WHERE rolname IN ('freight_api', 'freight_ingress', 'freight_worker')
                AND NOT rolsuper
                AND NOT rolbypassrls;
              IF role_count <> 3 THEN
                  RAISE EXCEPTION 'least-privilege integration roles are invalid';
              END IF;

              SELECT to_regprocedure('public.freight_resolve_webhook_connection(text)') IS NOT NULL
              INTO function_exists;
              IF NOT function_exists THEN
                  RAISE EXCEPTION 'opaque webhook resolver is missing';
              END IF;
          END;
          $block$;
          SQL

      - name: Run tests
        run: pytest -q

      - name: Verify canonical worker entry point
        run: python -m workers.integration_worker --mode all --once

      - name: Reject committed credential values
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path(name)
              for name in ("app", "workers", "deploy", "migrations", "tests", "scripts")
          ]
          patterns = {
              "private-key": re.compile(r"BEGIN (?:RSA|OPENSSH|EC) PRIVATE KEY"),
              "bearer-token": re.compile(
                  r"Authorization:\s*Bearer\s+[A-Za-z0-9._-]{16,}", re.IGNORECASE
              ),
              "hardcoded-api-key": re.compile(
                  r"api[_-]?key\s*=\s*[\"'][^$\"']{12,}[\"']", re.IGNORECASE
              ),
          }
          findings: list[tuple[str, str]] = []
          for root in roots:
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix.lower() == ".md":
                      continue
                  try:
                      content = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  for label, pattern in patterns.items():
                      if pattern.search(content):
                          findings.append((str(path), label))

          if findings:
              for path, label in findings:
                  print(f"Potential committed credential value: {path} ({label})")
              raise SystemExit(1)
          print("No committed credential values detected")
          PY
