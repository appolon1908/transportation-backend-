name: freight-platform-gateway

services:
  kong-config-render:
    image: ${GATEWAY_RENDERER_IMAGE:?set immutable renderer image digest}
    command: ["/templates/kong.yml.template", "/generated/kong.yml"]
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?required}
      KONG_REDIS_HOST: redis
      KONG_REDIS_PORT: "6379"
      KONG_REDIS_DATABASE: ${KONG_REDIS_DATABASE:-0}
      GATEWAY_SHARED_SECRET_FILE: /run/secrets/gateway_shared_secret
      KONG_REDIS_PASSWORD_FILE: /run/secrets/kong_redis_password
    secrets:
      - gateway_shared_secret
      - kong_redis_password
    volumes:
      - kong_config:/generated
    networks:
      - gateway_internal
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 128

  redis:
    image: ${REDIS_IMAGE:?set immutable Redis image digest}
    command:
      - sh
      - -ec
      - >-
        exec redis-server
        --appendonly yes
        --appendfsync everysec
        --save 900 1
        --save 300 10
        --maxmemory-policy noeviction
        --requirepass "$$(cat /run/secrets/kong_redis_password)"
    secrets:
      - kong_redis_password
    volumes:
      - redis_data:/data
    expose: ["6379"]
    networks:
      - gateway_internal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 128
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-cli -a "$$(cat /run/secrets/kong_redis_password)" ping 2>/dev/null | grep -q PONG
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  kong:
    image: ${KONG_IMAGE:?set immutable Kong image digest}
    depends_on:
      kong-config-render:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_ADMIN_LISTEN: "off"
      KONG_PROXY_LISTEN: 0.0.0.0:8000 reuseport backlog=16384
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_NGINX_WORKER_PROCESSES: auto
      KONG_NGINX_HTTP_CLIENT_BODY_BUFFER_SIZE: 2m
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: 2m
      KONG_LOG_LEVEL: ${KONG_LOG_LEVEL:-notice}
      KONG_ANONYMOUS_REPORTS: "off"
    volumes:
      - kong_config:/etc/kong:ro
    expose: ["8000", "8100"]
    networks:
      - gateway_internal
      - freight_private
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /usr/local/kong:size=128m,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 512
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  caddy:
    image: ${CADDY_IMAGE:?set immutable Caddy image digest}
    depends_on:
      kong:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:?verified API domain required}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?verified proxy CIDRs required}
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: udp
        mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gateway_public
      - gateway_internal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  gateway_shared_secret:
    file: ${GATEWAY_SHARED_SECRET_FILE:?required}
  kong_redis_password:
    file: ${KONG_REDIS_PASSWORD_FILE:?required}

volumes:
  kong_config:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  gateway_public:
  gateway_internal:
    internal: true
  freight_private:
    external: true
    name: ${FREIGHT_BACKEND_NETWORK:?verified external network name required}
