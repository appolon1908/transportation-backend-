services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: freight
      POSTGRES_USER: freight
      POSTGRES_PASSWORD: freight
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freight -d freight"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - freight_pg:/var/lib/postgresql/data

  api:
    build: .
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://freight:freight@postgres:5432/freight
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  freight_pg:
